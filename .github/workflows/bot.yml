name: Kyrox-MD Runner

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          npm install

      - name: Run Bot
        env:
          SESSION_ID: ${{ secrets.SESSION_ID }}
        run: |
          timeout 21500s npm start || echo "Relance automatique programmée..."
